<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="bremo-release" content="bremo-company-sims-20260927-v2" />
  <meta name="description" content="Bremo company HQ — a playable Sims-style office. Click-outs are not paid. Impact UNKNOWN." />
  <title>Company — Bremo Sims HQ</title>
  <link rel="icon" href="assets/plumbob.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <canvas id="world" aria-hidden="true"></canvas>
    <p id="hint">Click a Sim · <b>WASD</b> or arrows to walk · click the carpet to pathfind · keys <b>1–7</b> give orders</p>
    <div id="toasts" aria-live="polite"></div>
    <section id="plate" aria-label="Selected employee">
      <div id="sim-panel">
        <canvas id="portrait" width="168" height="210" aria-hidden="true"></canvas>
        <div class="identity">
          <div class="name-row">
            <img src="assets/plumbob.svg" width="18" height="18" alt="" />
            <div id="sim-name">Bremo God</div>
          </div>
          <div id="sim-role">Judgment</div>
          <div id="sim-status">On the floor</div>
          <div class="meters">
            <div class="meter-label"><span>Mood</span><span id="mood-val"></span></div>
            <div class="meter" aria-label="Mood"><i id="mood-fill"></i></div>
            <div class="meter-label"><span>Energy</span><span id="energy-val"></span></div>
            <div class="meter energy" aria-label="Energy"><i id="energy-fill"></i></div>
          </div>
        </div>
        <div id="roster" role="listbox" aria-label="Employees"></div>
        <div id="actions" role="toolbar" aria-label="Orders"></div>
        <form id="talk">
          <label for="talk-input">Say it as <b id="talk-who">Bremo God</b></label>
          <div class="talk-row">
            <input id="talk-input" type="text" maxlength="400" autocomplete="off" placeholder="Tell Analytics. Click-outs are not paid." />
            <button type="submit" id="talk-send">Send</button>
          </div>
        </form>
        <p class="fine">Click-outs are not paid. Impact UNKNOWN. Soft / KOHO / All Bonuses capture stays locked. Orders post a real line to Analytics.</p>
      </div>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
