    if (v.currentTime !== lastT) { lastT = v.currentTime; frozen = 0; return; }
    if (++frozen < 3) return;
    frozen = 0;
    if (++recoveries > 3) return fail("video stalled; showing live stills");
    if (hls) { hls.startLoad(); if (hls.liveSyncPosition) v.currentTime = hls.liveSyncPosition; }
    else { const src = v.currentSrc || cam.stream; v.src = src; }
    v.play().catch(() => {});
  }, 2000);
  const go = () => {
    if (curCam !== cam) return;
    if (!window.Hls || !Hls.isSupported()) return native();
    hls = new Hls({ liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 5, maxBufferLength: 30, backBufferLength: 20, manifestLoadingMaxRetry: 4, levelLoadingMaxRetry: 6, fragLoadingMaxRetry: 6 });
    hls.loadSource(cam.stream); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR && recoveries++ < 3) hls.startLoad();
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && recoveries++ < 3) hls.recoverMediaError();
      else fail(auto ? "" : "video stream unavailable; showing live stills");
    });
  };
  const native = () => { if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = cam.stream; v.play().catch(() => fail()); } else fail(); };
  // prefer hls.js wherever Media Source Extensions exist (Chrome, Brave, Edge, Firefox, desktop Safari); built-in HLS only as fallback (iPhone)
  if (!window.MediaSource && !window.ManagedMediaSource) return native();
  if (window.Hls) go(); else { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.light.min.js"; sc.onload = go; sc.onerror = native; document.head.appendChild(sc); }
}

/* ============================== panel ============================== */
function setTab(t) {
  curTab = t; document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === t));
  const L_ = $("#list"); L_.className = "list" + (t === "news" ? " news" : "");
  if (t === "states") L_.innerHTML = STATES.map(([name, ab, n]) => `<div class="row" tabindex="0" data-ab="${ab}"><span class="n">${rankOf(ab)}</span><span class="t">${esc(name)}<div class="bar"><i style="width:${(100 * n / maxC).toFixed(1)}%"></i></div></span><span class="v">${fmt(n)}</span></div>`).join("");
  else if (t === "exits") L_.innerHTML = EXITS.map((x, i) => `<div class="row" tabindex="0" data-exit="${i}"><span class="t">✕ ${esc(x[0])}, ${x[1]}<small>${esc(x[3])} · ${esc(x[2])} · ${esc(x[4])}</small></span></div>`).join("") + `<div class="note">Trackers count 200+ city and county exits in 2026, 93 in August alone. ${src("findingflock")}.</div>`;
  else if (t === "news") L_.innerHTML = NEWS.slice().reverse().map(([d, c, s, k]) => `<div class="row"><span class="n">${d}</span><span class="t">${esc(s)}<small>${src(k)}</small></span></div>`).join("");
  else if (t === "about") L_.innerHTML = `<div class="note"><b>What this is.</b> A map of automatic license plate readers (ALPRs), most of them sold by Flock Safety, which photograph every passing car and log the plate into a searchable network. Squares are ALPR points volunteers have mapped in OpenStreetMap; hollow squares are tagged Flock. Rings are public traffic cameras from state and city transportation departments: Caltrans (3,000+ across California) and NYC DOT. Flock's own feeds are private and are not shown; the rings let you see the road around a reader. ✕ marks towns that cancelled or paused Flock in 2026.</div><div class="note"><b>Tips.</b> Search a city or a camera name. Tap <b>near me</b> for the closest readers and cameras; your location never leaves the browser. Share copies a link to the exact view. Export downloads the ALPRs in view as CSV.<div class="acts" style="margin-top:8px"><button data-act="share">share this view</button><button data-act="export">export csv</button></div></div><div class="note"><b>Sources.</b> ${Object.keys(SRC).map(src).join(" · ")} · <a href="https://cwwp2.dot.ca.gov/" target="_blank" rel="noopener">Caltrans CWWP2</a> · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">NYC DOT</a>. Counts come from public reporting and volunteer mapping, not from Flock, and differ by source and date. Compiled 2026-10-03.</div>`;
  else if (t === "view") {
    const c = map.getCenter(), b = map.getBounds();
    const list = [...alprs.values()].filter(a => b.contains([a.lat, a.lon]) && (!flockOnly || a.flock)).map(a => ({ a, d: km(c.lat, c.lng, a.lat, a.lon) })).sort((x, y) => x.d - y.d).slice(0, 150);
    L_.innerHTML = list.length ? list.map(({ a, d }) => `<div class="row" tabindex="0" data-alpr="${a.id}"><span class="t">${a.flock ? "Flock " : ""}node ${a.id}<small>${esc(a.tags.operator || a.tags.manufacturer || a.tags.brand || "ALPR")}${a.tags["camera:direction"] ? " · facing " + esc(a.tags["camera:direction"]) + "°" : ""}</small></span><span class="v">${dist(d)}</span></div>`).join("") + `<div class="note"><button data-act="export" style="min-height:32px;padding:5px 12px;font-size:12px">export these ${list.length} as csv</button></div>`
      : `<div class="note">no ALPR points loaded in this view. zoom to street level (z ≥ 12) and they load from OpenStreetMap. distances are from the map centre.</div>`;
  } else if (t === "tc") {
    const c = map.getCenter();
    const list = camsInView().map(x => ({ c: x, d: km(c.lat, c.lng, x.lat, x.lon) })).sort((x, y) => x.d - y.d).slice(0, 150);
    const groups = [...new Set(FEEDS.map(f => f.group))].map(g => { const st = FEEDS.filter(f => f.group === g).map(f => feedState[f.id]); return `${g}: ${st.includes("ok") ? "on" : st.includes("loading") ? "loading" : st.includes("fail") ? "unavailable" : "idle"}`; }).join(" · ");
    L_.innerHTML = `<div class="note">${groups}</div>` + (list.length ? list.map(({ c, d }) => `<div class="row" tabindex="0" data-cam="${c.id}"><span class="t">${esc(c.name)}<small>${esc(c.place || "")}</small></span><span class="v">${dist(d)}</span></div>`).join("")
      : `<div class="note">no public traffic cameras in this view. feeds plugged in: California (Caltrans), New York City (NYC DOT) and Ontario (511ON). pan there at z ≥ 9, or search a camera name like <b>bay bridge</b>.</div>`);
  }
  L_.scrollTop = 0;
}
function showCard(html) { $("#list").innerHTML = `<div class="card">${html}</div>`; document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-pressed", false)); curTab = "card"; openSheet("half"); }
function onListClick(e) {
  const r = e.target.closest("[data-ab],[data-exit],[data-alpr],[data-cam],[data-act]"); if (!r) return;
  const d = r.dataset;
  if (d.ab) focusState(d.ab);
  else if (d.exit) { const x = EXITS[+d.exit]; map.flyTo([x[5], x[6]], 12); showCard(`<h2>✕ ${esc(x[0])}, ${x[1]}</h2><p>${esc(x[3])} · ${esc(x[2])}</p><p>${esc(x[4])}</p><p>${src(x[7])}</p>`); }
  else if (d.alpr) { const a = alprs.get(+d.alpr); map.flyTo([a.lat, a.lon], 17); showAlpr(a); if (!isDesktop()) openSheet("peek"); }
  else if (d.cam) { const c = tcams.get(d.cam); map.flyTo([c.lat, c.lon], Math.max(map.getZoom(), 14)); openCam(c.id); }
  else if (d.act === "osm") window.open("https://www.openstreetmap.org/node/" + d.id, "_blank", "noopener");
  else if (d.act === "cam") { const c = tcams.get(d.id); map.flyTo([c.lat, c.lon], Math.max(map.getZoom(), 14)); openCam(c.id); }
  else if (d.act === "findcam") { const [la, lo] = d.ll.split(",").map(Number); findCam(la, lo); }
  else if (d.act === "share") share();
  else if (d.act === "export") exportCsv();
}
function focusState(ab) {
  const st = byAb[ab]; if (!st) return;
  const ex = EXITS.filter(e => e[1] === ab), feeds = FEEDS.some(f => f.id.startsWith(ab === "CA" ? "ca" : ab === "NY" ? "nyc" : "~"));
  if (stateLayer) { const l = stateLayer.getLayers().find(l => l.feature.st[1] === ab); if (l) map.flyToBounds(l.getBounds(), { maxZoom: 8, padding: [20, 20] }); }
  showCard(`<h2>${esc(st[0])}</h2><p>${fmt(st[2])} mapped ALPRs · rank ${rankOf(ab)} of ${STATES.length} · ${(100 * st[2] / TOTAL).toFixed(1)}% of the US total</p>` +
    (ex.length ? `<p>✕ exits: ${ex.map(e => esc(e[0])).join(", ")}</p>` : "") + (feeds ? `<p>◉ public traffic cameras are plugged in for this state</p>` : "") +
    `<p>zoom into a city to load the individual readers.</p>`);
  if (!isDesktop()) openSheet("peek");
}

/* ---------- bottom sheet ---------- */
let sheetPos = "peek";
function openSheet(p) { sheetPos = p; const s = $("#sheet"); s.classList.remove("half", "full"); if (p !== "peek") s.classList.add(p); }
function sheetDrag() {
  const s = $("#sheet"), h = $("#handle"); let y0 = 0, p0 = 0, dragging = false;
  const start = e => { dragging = true; y0 = e.touches ? e.touches[0].clientY : e.clientY; p0 = s.getBoundingClientRect().top; s.classList.add("drag"); };
  const move = e => { if (!dragging) return; const y = e.touches ? e.touches[0].clientY : e.clientY; const top = Math.max(innerHeight - s.offsetHeight, p0 + (y - y0)); s.style.transform = `translateY(${top - (innerHeight - s.offsetHeight)}px)`; };
  const end = e => { if (!dragging) return; dragging = false; s.classList.remove("drag"); s.style.transform = ""; const y = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY), dy = y - y0; if (Math.abs(dy) < 8) { openSheet(sheetPos === "peek" ? "half" : "peek"); return; } openSheet(dy < 0 ? (sheetPos === "peek" ? "half" : "full") : (sheetPos === "full" ? "half" : "peek")); };
  [h, $("#sheet .tabs")].forEach(el => { el.addEventListener("touchstart", start, { passive: true }); el.addEventListener("mousedown", start); });
  addEventListener("touchmove", move, { passive: true }); addEventListener("mousemove", move);
  addEventListener("touchend", end); addEventListener("mouseup", end);
}

/* ============================== actions ============================== */
async function search(q) {
  const ql = q.toLowerCase();
  if (tcams.size) { const hit = [...tcams.values()].find(c => (c.name + " " + (c.place || "")).toLowerCase().includes(ql)); if (hit && !/^\d/.test(ql) && ql.length > 3 && !/,|\b(st|ave|rd|blvd|street|avenue|road)\b/.test(ql) && !STATES.some(s => s[0].toLowerCase() === ql)) { map.flyTo([hit.lat, hit.lon], 14); openCam(hit.id); return; } }
  const st = STATES.find(s => s[0].toLowerCase() === ql || s[1].toLowerCase() === ql); if (st) return focusState(st[1]);
  status(`searching "${q}"…`);
  try {
    const j = await (await fetchT(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us,pr&q=${encodeURIComponent(q)}`)).json();
    if (!j[0]) { // maybe a camera name in a feed not loaded yet
      await Promise.all(FEEDS.map(loadFeed)); const hit = [...tcams.values()].find(c => (c.name + " " + (c.place || "")).toLowerCase().includes(ql));
      if (hit) { map.flyTo([hit.lat, hit.lon], 14); openCam(hit.id); return; }
      return status(`nothing found for "${q}"`);
    }
    const bb = j[0].boundingbox.map(Number);
    map.flyToBounds([[bb[0], bb[2]], [bb[1], bb[3]]], { maxZoom: 13 });
    map.once("moveend", () => { if (map.getZoom() < 12) map.setZoom(12); });
    status(j[0].display_name.split(",").slice(0, 3).join(","));
    if (!isDesktop()) openSheet("peek");
  } catch { status("search is unreachable right now"); }
}
function near() {
  if (!navigator.geolocation) return toast("no location on this device");
  status("locating… your position stays in this browser");
  navigator.geolocation.getCurrentPosition(p => {
    const la = p.coords.latitude, lo = p.coords.longitude;
    if (meMarker) meMarker.remove(); meMarker = L.marker([la, lo], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [14, 14] }), interactive: false }).addTo(map);
    map.setView([la, lo], 14);
    setTimeout(async () => {
      await Promise.all([scan(true), ...feedsFor(la - .4, lo - .4, la + .4, lo + .4).map(loadFeed)]);
      const na = nearestAlprs(la, lo), nc = nearestCams(la, lo, 3);
      showCard(`<h2>near you</h2>` + (na.length ? na.map(({ a, d }) => `<div class="row" tabindex="0" data-alpr="${a.id}" style="padding:7px 0"><span class="t">${a.flock ? "Flock " : ""}node ${a.id}<small>${esc(a.tags.operator || a.tags.manufacturer || "ALPR")}</small></span><span class="v">${dist(d)}</span></div>`).join("") : `<p>no mapped ALPRs loaded within this view${busy ? "" : " (or OpenStreetMap is slow right now)"}.</p>`) +
        (nc.length ? `<p style="margin-top:8px">public traffic cams</p>` + nc.map(({ c, d }) => `<div class="row" tabindex="0" data-cam="${c.id}" style="padding:7px 0"><span class="t">${esc(c.name)}<small>${esc(c.place || "")}</small></span><span class="v">${dist(d)}</span></div>`).join("") : `<p>no public traffic feed is plugged in here yet (California and NYC so far).</p>`));
      openSheet("half");
    }, 500);
  }, () => toast("location permission denied; search your city instead"), { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
}
function exportCsv() {
  const b = map.getBounds(); const rows = [...alprs.values()].filter(a => b.contains([a.lat, a.lon]) && (!flockOnly || a.flock));
  if (!rows.length) return toast("no ALPR points in view to export");
  const cols = ["osm_id", "lat", "lon", "flock", "operator", "manufacturer", "direction", "osm_url"];
  const csv = [cols.join(",")].concat(rows.map(a => [a.id, a.lat, a.lon, a.flock, a.tags.operator || "", a.tags.manufacturer || a.tags.brand || "", a.tags["camera:direction"] || a.tags.direction || "", "https://www.openstreetmap.org/node/" + a.id].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))).join("\n");
  const u = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); const l = document.createElement("a"); l.href = u; l.download = `alpr-in-view-${Date.now()}.csv`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  toast(`exported ${rows.length} rows`);
}
async function share() { writeHash(); const url = location.href; if (navigator.share && !isDesktop()) { try { await navigator.share({ title: "Flock camera map", url }); return; } catch (_) {} } try { await navigator.clipboard.writeText(url); toast("link copied"); } catch { prompt("copy this link", url); } }

/* ============================== url state ============================== */
function writeHash() {
  if (hashLock || !map) return;
  const c = map.getCenter(); const p = new URLSearchParams({ ll: `${c.lat.toFixed(4)},${c.lng.toFixed(4)}`, z: map.getZoom() });
  if (root.dataset.theme) p.set("t", root.dataset.theme);
  if (curCam) p.set("cam", curCam.id); if (flockOnly) p.set("flock", "1");
  if ($("#l-tc").getAttribute("aria-pressed") !== "true") p.set("tc", "0");
  history.replaceState(null, "", "#" + p);
}
async function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("t") === "dark" || p.get("t") === "light") setTheme(p.get("t"), true);
  if (p.get("flock") === "1") { flockOnly = true; $("#l-flock").setAttribute("aria-pressed", "true"); }
  if (p.get("tc") === "0") $("#l-tc").setAttribute("aria-pressed", "false");
  const ll = (p.get("ll") || "").split(",").map(Number), z = +p.get("z");
  if (ll.length === 2 && ll.every(isFinite) && z) map.setView(ll, z);
  hashLock = false; writeHash(); onMove();
  const cam = p.get("cam");
  if (cam) { const f = FEEDS.find(f => cam.startsWith(f.id + "-")); if (f) { await loadFeed(f); if (tcams.has(cam)) openCam(cam); } }
}
